<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Cuerpo del panda -->
  <circle cx="100" cy="130" r="40" fill="#333"/>
  <circle cx="100" cy="80" r="30" fill="white" stroke="#333" stroke-width="2"/>
  
  <!-- Orejas -->
  <circle cx="75" cy="60" r="10" fill="#333"/>
  <circle cx="125" cy="60" r="10" fill="#333"/>
  
  <!-- Ojos -->
  <ellipse cx="85" cy="75" rx="6" ry="8" fill="#333"/>
  <ellipse cx="115" cy="75" rx="6" ry="8" fill="#333"/>
  
  <!-- Nariz y boca -->
  <circle cx="100" cy="90" r="3" fill="#333"/>
  <path d="M 90 95 Q 100 102 110 95" stroke="#333" fill="transparent" stroke-width="2"/>
  
  <!-- Brazos -->
  <rect x="65" y="110" width="10" height="30" rx="5" fill="#333" transform="rotate(-20 70 120)"/>
  <rect x="125" y="110" width="10" height="30" rx="5" fill="#333" transform="rotate(20 130 120)"/>
  
  <!-- Skateboard -->
  <rect x="60" y="165" width="80" height="10" rx="5" fill="#e74c3c"/>
  <circle cx="75" cy="180" r="6" fill="#333"/>
  <circle cx="125" cy="180" r="6" fill="#333"/>
  
  <!-- Maletín -->
  <rect x="130" y="125" width="20" height="15" rx="2" fill="#5d4037"/>
</svg>